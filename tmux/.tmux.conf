# ~/.tmux.conf

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Send copied text to the local terminal clipboard, including over SSH.
# Requires OSC 52 clipboard access to be enabled in the local terminal.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Copy mouse selections and leave copy mode when the mouse is released.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"


# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# CPU Plugin
set -g @plugin 'tmux-plugins/tmux-cpu'

# RAM Plugin
set -g @plugin 'pwittchen/tmux-plugin-ram'

# Setting status bar to top
set -g status-position top

set -g extended-keys on
set -as terminal-features "xterm*:extkeys"

run '~/.tmux/plugins/tpm/tpm'

